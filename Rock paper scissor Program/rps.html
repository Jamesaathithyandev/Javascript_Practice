<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="rps.css">
  </head>
  <body>
    <div class="divbox">
        <h1>Rock-Paper-Scissors</h1>
        <div class="buttons">
            <button id="rock" onclick ="playerchoice('rock')">👊</button>
            <button id="paper" onclick ="playerchoice('paper')">🖐️</button>
            <button id="scissor" onclick ="playerchoice('scissor')">✌️</button>
        </div>
        <div id="playerdisplay"></div>
        <div id="computerdisplay"></div>
        <div id="resultdisplay"></div>

        <div class="scoredisplay">PlayerScore: 
            <span id="playerscore"> 0</span>        
        </div>
        <div class="scoredisplay">ComputerScore: 
            <span id="computerscore"> 0</span>        
        </div>
    </div>
        
  <script src="rps.js" defer></script>
  </body>
</html>
