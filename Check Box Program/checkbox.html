<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>HTML 5 Boilerplate</title>
    <link rel="stylesheet" href="checkbox.css">
  </head>
  <body>
    <h1>Check Box Program</h1>
    <form id="checkboxform">
        <input type="checkbox" id="check">
        <label id="checklabel">Subscribe</label><br><br>
        <label id="visalabel">Visa</label>
        <input type="radio" id="visa" name ="card"> <br>
        <label id="mastercardlabel">Mastercard</label>
        <input type="radio" id="mastercard" name ="card"><br>
        <label id="paypallabel">PayPal</label>
        <input type="radio" id="paypal" name ="card" > <br><br>
        <button type="button" id="submit">Submit</button>
        <p id="checkresult"></p>
        <p id="radioresult"></p>
    </form>
    <script src="checkbox.js"></script>
  </body>
</html>
