<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Temperature Conversion</title>
  
</head>
<body>
    <form id="formblock">
        <label id="temp">Enter Temperature:</label>
        <input type="number" id="tempInput" placeholder="Enter temperature"><br><br>
        <label id="ctof">Celsius to Fahrenheit</label>
        <input type="radio" name="conversion" value="ctof"><br>
        <label id="ftoc">Fahrenheit to Celsius</label>
        <input type="radio" name="conversion" value="ftoc"><br><br>
        <button type="button" id="convertBtn">Convert</button>
    </form>
  <script src="temp.js"></script>
</body>
</html>
