<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Temperature Conversion</title>
  <link rel="stylesheet" href="temp.css">
</head>
<body>
    <form id="formblock">
        <label id="temp">Enter Temperature</label>
        <input type="number" id="tempInput" placeholder="Enter temperature"><br><br>
        <label for="ctof">Celsius to Fahrenheit</label>
        <input type="radio" name="conversion" id="ctof" value="ctof"><br>
        <label for="ftoc">Fahrenheit to Celsius</label>
        <input type="radio" name="conversion" id="ftoc" value="ftoc"><br><br>
        <button type="button" id="convertBtn" onclick="convert()">Convert</button>
        <p id="result">Select a Conversion</p>
    </form>
  <script src="temp.js"></script>
</body>
</html>
